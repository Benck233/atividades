<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Entre em Contato</h1>
        <div class="controles-barra">
            <button id="dark-mode-toggle">🌙 Modo Noturno</button>
            <button id="btn-aumentar">A+</button>
            <button id="btn-diminuir">A-</button>
        </div>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">Sobre Mim</a></li>
            <li><a href="curriculum.html">Currículo</a></li>
            <li><a href="contact.html">Contato</a></li>
            <li><a href="receitas.html">Receitas Favoritas</a></li>
        </ul>
    </nav>
    <main>
        <section style="max-width: 600px; margin: 0 auto;">
            <h2>Formulário de Mensagem</h2>
            <form id="form-contato" action="#" method="POST">
                <div class="form-grupo">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" placeholder="Escreva o seu nome...">
                </div>
                <div class="form-grupo">
                    <label for="email">E-mail de Contato *</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-grupo">
                    <label for="mensagem">Sua Mensagem *</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui a sua mensagem..."></textarea>
                </div>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 - Desenvolvido por Mim no Trabalho de Web</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
