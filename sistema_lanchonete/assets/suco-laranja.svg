<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="100" height="100" fill="#f0f0f0"/>
  
  <!-- Copo -->
  <rect x="30" y="20" width="40" height="60" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  
  <!-- Suco (laranja) -->
  <rect x="32" y="25" width="36" height="50" fill="#ff9800"/>
  
  <!-- Destaque do suco -->
  <rect x="35" y="28" width="8" height="40" fill="#ffb74d" opacity="0.6"/>
  
  <!-- Canudo -->
  <rect x="44" y="15" width="4" height="50" fill="#d32f2f"/>
  <rect x="42" y="15" width="2" height="50" fill="#b71c1c" opacity="0.7"/>
  
  <!-- Gotas de suco (pixeladas) -->
  <rect x="55" y="35" width="6" height="6" fill="#ff9800" opacity="0.7"/>
  <rect x="60" y="40" width="4" height="4" fill="#ff9800" opacity="0.7"/>
</svg>